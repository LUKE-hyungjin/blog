baseURL = 'https://luke-hyungjin.github.io/blog/'
languageCode = 'en-us'
title = 'LUKE'
timeZone = 'Asia/Seoul'

# i18n
defaultContentLanguage = 'en'
hasCJKLanguage = false

# Pagination / summaries
summaryLength = 70

# SEO
enableRobotsTXT = true

# Stack theme
theme = 'hugo-theme-stack'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[permalinks]
  post = '/p/:slug/'
  page = '/:slug/'

[pagination]
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS']

[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 200

[params]
  # Used by Stack theme as default meta description when page description is not provided.
  description = 'Tech blog'
  mainSections = ['post']
  # Use relative path so Hugo resolves it correctly under GitHub Pages Project Pages (/blog/)
  favicon = 'favicon.svg'

  [params.imageProcessing]
    [params.imageProcessing.cover]
      enabled = true
    [params.imageProcessing.content]
      enabled = true

  [params.defaultImage]
    [params.defaultImage.opengraph]
      enabled = true
      local = true
      src = 'img/avatar.jpg'

  [params.article]
    toc = true
    readingTime = true
    math = true

  [params.comments]
    enabled = true
    provider = 'giscus'

    [params.comments.giscus]
      repo = 'LUKE-hyungjin/blog'
      repoID = 'R_kgDOQy9J7A'
      category = 'General'
      categoryID = 'DIC_kwDOQy9J7M4C0hqR'
      mapping = 'pathname'
      strict = 0
      reactionsEnabled = 1
      emitMetadata = 0
      inputPosition = 'bottom'
      # Match Stack's light/dark as closely as possible
      lightTheme = 'light'
      darkTheme = 'transparent_dark'
      lang = 'en'
      loading = 'lazy'

  [params.colorScheme]
    toggle = true
    default = 'auto'

  [params.sidebar]
    subtitle = 'Tech blog'

[params.sidebar.avatar]
  enabled = true
  local = true
  src = 'img/avatar.jpg'

[menu]
  [[menu.social]]
    identifier = 'website'
    name = 'Website'
    url = 'https://www.lukedev.info/'
    [menu.social.params]
      Icon = 'website'

  [[menu.social]]
    identifier = 'github'
    name = 'GitHub'
    url = 'https://github.com/LUKE-hyungjin'
    [menu.social.params]
      Icon = 'github'

  [[menu.social]]
    identifier = 'linkedin'
    name = 'LinkedIn'
    url = 'https://www.linkedin.com/in/%ED%98%95%EC%A7%84-%EC%9D%B4-ab1a29247/'
    [menu.social.params]
      Icon = 'linkedin'

  [params.widgets]
    homepage = [
      { type = 'search' },
      { type = 'archives', params = { limit = 5 } },
      { type = 'categories', params = { limit = 10 } },
      { type = 'tag-cloud', params = { limit = 10 } }
    ]
    page = [
      { type = 'toc' }
    ]
